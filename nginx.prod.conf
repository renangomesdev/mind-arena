# Limite de Taxa de Requisições (Proteção Anti-DDoS e Flooding)
limit_req_zone $binary_remote_addr zone=arena_req:10m rate=25r/s;
limit_conn_zone $binary_remote_addr zone=arena_conn:10m;

server {
    listen 80;
    server_name mind-arena.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mind-arena.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/mind-arena.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mind-arena.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Headers de Segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Mitigação contra ataques Slowloris e Buffer Overflow
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    client_max_body_size 5M;

    # Bloqueio imediato na borda de varredura por arquivos e endpoints confidenciais
    location ~* (\.env|\.git|\.aws|wp-admin|wp-login|xmlrpc\.php|phpmyadmin|actuator) {
        return 403;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        # Aplicação de Rate Limiting por IP (Proteção DoS)
        limit_req zone=arena_req burst=35 nodelay;
        limit_conn arena_conn 20;

        proxy_pass http://backend:8080/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
