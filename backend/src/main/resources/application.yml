spring:
  application:
    name: Mind Arena
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mindarena}
    username: ${DATABASE_USERNAME:mindarena_user}
    password: ${DATABASE_PASSWORD:mindarena_password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

logging:
  level:
    org.springframework.web: INFO
    com.mindarena: DEBUG
