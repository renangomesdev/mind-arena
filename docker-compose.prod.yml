services:
  db:
    image: postgres:15-alpine
    container_name: mindarena_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mindarena}
      POSTGRES_USER: ${POSTGRES_USER:-mindarena_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindarena_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - arena_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindarena_backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://db:5432/mindarena}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-mindarena_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-mindarena_password}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
    networks:
      - arena_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=https://mind-arena.duckdns.org/api
        - VITE_WS_URL=wss://mind-arena.duckdns.org/ws
    container_name: mindarena_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - arena_net

volumes:
  pgdata:

networks:
  arena_net:
    driver: bridge
